# Tag-driven release: the tag is the version.
#
#   git tag v0.5.1 && git push origin v0.5.1
#
# Version: scripts/version.mjs set <tag> writes it into every package before the build,
#          so the committed version may lag behind the tag.
# Build:   pnpm install → typecheck → build → test → scripts/package.mjs
# Output: GitHub Release "v<version>" with everything in dist/:
#           onenightcarnival-dsh-{rdb,s3,http,otel,bridge-browser,subscriptions,config-center,memory,gateway,toolkit}-<version>.tgz
#           dsh-browser-extension-chrome-<version>.zip
#           SHA256SUMS.txt
#         A prerelease label (v0.5.1-rc.1) marks the Release as pre-release.
# npm:    with the repository variable NPM_PUBLISH set to "true", the toolkit tarball of the Release
#         is staged on npm through trusted publishing: dist-tag "latest", or "next" for a prerelease.
#         A maintainer approves the staged version on npmjs.com before it is public.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Take the version from the tag
        run: node scripts/version.mjs set "${GITHUB_REF_NAME#v}"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Package
        run: |
          node scripts/package.mjs
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"

  npm:
    needs: release
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15 or later.
      - name: Update npm
        run: npm install --global npm@^11.15.0

      - name: Download the toolkit tarball of the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="onenightcarnival-dsh-toolkit-${GITHUB_REF_NAME#v}.tgz"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$file" --pattern SHA256SUMS.txt
          grep -F "  $file" SHA256SUMS.txt | sha256sum --check

      - name: Stage on npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          if [[ "$version" == *-* ]]; then
            tag=next
          fi
          npm stage publish "onenightcarnival-dsh-toolkit-${version}.tgz" --access public --tag "$tag"
